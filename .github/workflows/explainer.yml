name: Explainer

# Builds the interactive explainer (explainer/README.md), checks it against
# the native estimator, and publishes it with GitHub Pages from master.

on:
  pull_request:
    paths:
      - 'explainer/**'
      - 'include/**'
      - 'examples/euroc_benchmark/**'
      - 'examples/attitude_benchmark/*.h'
      - 'CMakeLists.txt'
      - 'patch/**'
      - '.github/workflows/explainer.yml'
  push:
    branches: [master]
    paths:
      - 'explainer/**'
      - 'include/**'
      - 'examples/euroc_benchmark/**'
      - 'examples/attitude_benchmark/*.h'
      - 'CMakeLists.txt'
      - 'patch/**'
      - '.github/workflows/explainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explainer-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: '7.0.0'
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numpy
        run: python -m pip install numpy==2.2.6
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          emsdk/emsdk install "$EMSDK_VERSION"
          emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Cache verified EuRoC sensor and reference files
        uses: actions/cache@v4
        with:
          path: .benchmark-cache/euroc
          key: explainer-euroc-${{ hashFiles('examples/euroc_benchmark/datasets.lock.json', 'explainer/tools/pack_euroc.py') }}
      - name: Build the native estimator and the interface check
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUKF_BUILD_EXPLAINER=ON
          cmake --build build --target euroc_benchmark explainer_check --parallel 2
      - name: Build the site
        run: |
          source emsdk/emsdk_env.sh
          python explainer/build.py
      - name: Check the page's estimator against the native one
        env:
          EXPLAINER_REQUIRE_ALL: '1'
        run: python -m unittest discover -s explainer/test -v
      - name: Check the page in a browser
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          node explainer/test/smoke.cjs
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: explainer/_site

  deploy:
    name: Publish with GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
