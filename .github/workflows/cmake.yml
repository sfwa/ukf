name: CMake

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        config:
          - { name: Linux GCC, os: ubuntu-24.04, CC: gcc, CXX: g++ }
          - { name: Linux Clang, os: ubuntu-24.04, CC: clang, CXX: clang++ }
          - { name: macOS Clang, os: macos-latest, CC: clang, CXX: clang++ }
    env:
      CC: ${{ matrix.config.CC }}
      CXX: ${{ matrix.config.CXX }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build build --target unittest --config ${{ matrix.build_type }} --parallel 2

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
