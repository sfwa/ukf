name: Attitude benchmark

on:
  pull_request:
    paths:
      - 'include/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'patch/**'
      - '.github/workflows/attitude-benchmark.yml'
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'patch/**'
      - '.github/workflows/attitude-benchmark.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Recordings to evaluate
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

concurrency:
  group: attitude-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: ${{ matrix.dataset }} / 6 and 9 axes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dataset: [broad, sassari]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/attitude_benchmark/requirements.txt
      - name: Install reference algorithms and dataset readers
        run: python -m pip install -r examples/attitude_benchmark/requirements.txt
      - name: Cache pinned datasets
        uses: actions/cache@v4
        with:
          path: .benchmark-cache
          key: attitude-data-v1-${{ matrix.dataset }}-${{ github.event_name == 'pull_request' && 'smoke' || inputs.scope == 'smoke' && 'smoke' || 'full' }}-${{ hashFiles('examples/attitude_benchmark/datasets.lock.json') }}
      - name: Build estimators
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target attitude_benchmark --parallel 2
      - name: Validate geometry and synthetic estimation
        run: python -m unittest discover -s examples/attitude_benchmark -p 'test_*.py' -v
      - name: Compare on recorded measurements
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          DATASET: ${{ matrix.dataset }}
        shell: bash
        run: |
          scope=()
          if [[ "$EVENT_NAME" == "pull_request" || "$REQUESTED_SCOPE" == "smoke" ]]; then
            scope=(--smoke)
          fi
          python examples/attitude_benchmark/run.py \
            --datasets "$DATASET" --output "benchmark-results/$DATASET" "${scope[@]}"
      - name: Upload comparison and per-trial metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attitude-comparison-${{ matrix.dataset }}
          path: benchmark-results/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 30
